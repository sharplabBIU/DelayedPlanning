# Conda environment used for the reproducibility check of the manuscript (7 Oct 2026, macOS arm64).
#   conda env create -f environment.yml && conda activate delayed-planning
# All behavioural analyses, the RT mixed models (PyMC) and the soft-gated MBMC model fits run in this environment.
# The SR/PR competitor fits in model_fitting_revision/ additionally need the cbm_python toolbox (see that folder's README).
name: delayed-planning
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy=2.1.3
  - pandas=2.2.3
  - scipy=1.15.1
  - matplotlib=3.10.0
  - seaborn=0.13.2
  - pymc=5.22.0
  - arviz=0.21.0
  - statsmodels=0.14.4
  - xarray=2024.11.0
  - xarray-einstats=0.6.0
  - networkx
  - openpyxl
  - jupyterlab
  - ipykernel
  - nbconvert
  - nbformat
